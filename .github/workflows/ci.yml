name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py
      - run: python - <<'PY'
          from fastapi.testclient import TestClient
          from app import app
          c=TestClient(app)
          assert c.get('/health').status_code==200
          r=c.post('/api/login',json={'email':'admin@aayam.ai','password':'Admin@123'})
          assert r.status_code==200
          t=r.json()['access_token']
          assert c.get('/api/dashboard',headers={'Authorization':'Bearer '+t}).status_code==200
          print('Aayam smoke tests passed')
          PY
